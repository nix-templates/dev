name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Trimming superseded caches goes through the Actions REST API.
  actions: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main

      # Keeps /nix/store in the GitHub Actions cache. This job only evaluates,
      # so what it saves is the nixpkgs fetch and the evaluation of 68 flakes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # GitHub allows 10G of cache per repository, so leave room to spare.
          gc-max-store-size-linux: 5G
          # Drop every older cache once this one is saved.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Check formatting
        run: nix develop --command check-formatting

      - name: Evaluate every template
        run: nix develop --command check
